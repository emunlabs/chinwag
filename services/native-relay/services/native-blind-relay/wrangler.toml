name = "chinwag-native-blind-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-19"
workers_dev = true

[build]
command = "worker-build --release --locked"

[durable_objects]
bindings = [{ name = "NATIVE_RELAY", class_name = "NativeBlindRelay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NativeBlindRelay"]

[observability]
enabled = false
