[package]
name = "native-blind-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license = "LicenseRef-proprietary"
description = "Allowlisted iroh-relay-v2 data plane for one pair of endpoints"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "=1.8.7"
ed25519-dalek = "=2.2.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "=0.11.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
worker = "=0.8.7"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
iroh-base = "=1.4.1"
iroh-dns = "=1.4.1"
iroh-relay = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
rand = "0.9"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
tokio-websockets = { version = "0.13", features = ["server", "sha1_smol"] }

[[example]]
name = "readiness"
path = "examples/readiness.rs"
