[package]
name = "chinwag-mcp-private-anchored"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chinwag-snapshot-session-private = { path = "../chinwag-snapshot-session" }
chinwag-snapshot-read-owner-private = { path = "../chinwag-snapshot-read-owner" }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "io-util", "io-std", "sync"] }

[features]
private-http-probe = ["rmcp/transport-streamable-http-server", "dep:bytes", "dep:http", "dep:http-body", "dep:http-body-util", "dep:tower-service", "dep:tokio-util", "dep:subtle", "dep:zeroize"]

private-loopback = ["private-http-probe", "dep:hyper", "dep:hyper-util", "tokio/net", "tokio/time", "tokio/signal"]

[dependencies.bytes]
version = "=1.12.1"
optional = true
[dependencies.http]
version = "=1.5.0"
optional = true
[dependencies.http-body]
version = "=1.1.0"
optional = true
[dependencies.http-body-util]
version = "=0.1.5"
optional = true
[dependencies.tower-service]
version = "=0.3.3"
optional = true
[dependencies.tokio-util]
version = "=0.7.20"
features = ["rt"]
optional = true
[dependencies.subtle]
version = "=2.6.1"
optional = true
[dependencies.zeroize]
version = "=1.9.1"
optional = true

[dependencies.hyper]
version = "=1.12.0"
default-features = false
features = ["server", "http1", "client"]
optional = true
[dependencies.hyper-util]
version = "=0.1.21"
default-features = false
features = ["tokio"]
optional = true
