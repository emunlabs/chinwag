[package]
name = "chinwag-native-launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chinwag-client-discovery = { path = "../chinwag-client-discovery" }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "block2", "libc"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
core-foundation = "=0.10.1"
