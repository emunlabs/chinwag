<!DOCTYPE html>
<html lang="en" data-theme="stone">
<head>
  <script src="/assets/v4/theme-boot.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="chinwag-csrf" content="{{CHINWAG_CSRF_TOKEN}}">
  <meta name="chinwag-port" content="{{CHINWAG_PORT}}">
  <title>Inbox · chinwag</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/v4/Geist-Latin.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/v4/GeistMono-Latin.woff2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/v4/styles.css">
  <link rel="stylesheet" href="/assets/v4/motion.css">
  <script type="module" src="/assets/v4/motion.js"></script>
  <script type="module" src="/assets/v4/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header" id="app-header" role="banner">
    <div class="hdr-left">
      <button class="btn-icon d2-mobile-trigger" id="btn-d2-drawer" type="button" aria-controls="d2-rail" aria-expanded="false" aria-label="Open Delivery-2 (⌘B)" title="Open Delivery-2 (⌘B)">
        <svg class="icon-svg" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2" y="2.5" width="12" height="11" rx="2"></rect>
          <path d="M6 2.5v11"></path>
        </svg>
      </button>
      <a class="wordmark" href="#inbox" aria-label="chinwag, go to Inbox">chinwag</a>
      <button class="repo-pill" id="repo-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Change repository">
        <span class="repo" id="repo-pill-name">Select repository</span>
        <span class="sep" id="repo-pill-sep" aria-hidden="true" hidden>·</span>
        <span class="branch" id="repo-pill-branch" hidden></span>
      </button>
    </div>

    <nav class="tabs" id="header-tabs" aria-label="Main">
      <a href="#inbox" data-route="inbox" aria-current="page">
        <span>Inbox</span>
        <span class="badge" id="inbox-badge-desktop" hidden></span>
      </a>
      <a href="#board" data-route="board">Board</a>
      <a href="#agents" data-route="agents">Agents &amp; Rules</a>
      <a href="#credits" data-route="credits">Credits</a>
      <span class="tab-ink" aria-hidden="true"></span>
    </nav>

    <div class="hdr-right">
      <button class="btn-secondary btn-sm hdr-desktop-only" id="btn-invite" type="button">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-label">Invite teammate</span>
      </button>
      <a class="credit-pill" id="header-credit-pill" href="#credits" data-level="unavailable" aria-label="Loading balance">
        <span class="skeleton skeleton-pill" id="credit-pill-skeleton" aria-hidden="true"></span>
        <span id="credit-pill-text" hidden>Balance unavailable</span>
      </a>
      <button class="btn-icon hdr-desktop-only" id="btn-theme" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="icon-svg" id="theme-icon-moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"></path>
        </svg>
        <svg class="icon-svg" id="theme-icon-sun" viewBox="0 0 16 16" aria-hidden="true" hidden>
          <circle cx="8" cy="8" r="3.2"></circle>
          <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
        </svg>
      </button>
      <button class="btn-ghost btn-sm hdr-desktop-only" id="btn-privacy" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Privacy and usage analytics">
        <svg class="icon-svg sm" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3.5" y="7" width="9" height="6.5" rx="1.5"></rect>
          <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path>
        </svg>
        <span>Local privacy</span>
      </button>
      <button class="btn-secondary btn-sm menu-btn" id="btn-mobile-menu" type="button" aria-haspopup="dialog" aria-expanded="false">Menu</button>
    </div>
  </header>

  <nav class="tabrow" id="mobile-tabrow" aria-label="Main">
    <a href="#inbox" data-route="inbox" aria-current="page">
      <span>Inbox</span>
      <span class="badge" id="inbox-badge-mobile" hidden></span>
    </a>
    <a href="#board" data-route="board">Board</a>
    <a href="#agents" data-route="agents">Agents &amp; Rules</a>
    <a href="#credits" data-route="credits">Credits</a>
    <span class="tab-ink" aria-hidden="true"></span>
  </nav>

  <div class="app-body" id="app-body">
    <div class="d2-drawer-scrim" id="d2-drawer-scrim" hidden></div>
    <aside id="d2-rail" class="d2-rail" aria-label="Delivery-2">
      <button id="d2-rail-toggle-fixed" class="d2-rail-toggle d2-rail-toggle-fixed" type="button" aria-controls="d2-rail" aria-expanded="true" aria-label="Collapse Delivery-2 panel (⌘B)" title="Toggle Delivery-2 (⌘B)"></button>
      <div id="d2-track" class="d2-track"></div>
      <div id="d2-spine" class="d2-spine" aria-label="Delivery-2 quick status"></div>
    </aside>

    <main id="main" class="app-main" tabindex="-1">
      <div id="session-alert-host"></div>
      <div id="view-root"></div>
    </main>
  </div>

  <div class="popover-layer" id="popover-layer" hidden></div>
  <div class="modal-scrim" id="modal-scrim" hidden></div>
  <div class="modal-layer" id="modal-layer" hidden></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="sr-announcer" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
