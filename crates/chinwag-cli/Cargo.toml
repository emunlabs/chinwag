[package]
name = "chinwag-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chinwag"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
chinwag-swarm = { path = "../chinwag-swarm", version = "=0.0.1" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
rustix = { version = "1", features = ["fs", "process"] }
rand.workspace = true
chinwag-signing = { path = "../chinwag-signing" }
chinwag-confirmed-initial-private = { path = "../confirmed-initial" }
chinwag-mcp-private-anchored = { path = "../chinwag-mcp", features = ["private-loopback"] }
chinwag-editor-config-private = { path = "../chinwag-editor-config" }
chinwag-snapshot-session-private = { path = "../chinwag-snapshot-session" }
chinwag-snapshot-read-owner-private = { path = "../chinwag-snapshot-read-owner" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
chinwag-test-fixtures = { path = "../chinwag-test-fixtures" }
