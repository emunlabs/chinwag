[package]
name = "chinwag-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chinwag"
path = "src/main.rs"

[dependencies]
chinwag-fleet = { path = "../chinwag-fleet" }

[target.'cfg(target_os = "macos")'.dependencies]
chinwag-host-process = { path = "../chinwag-host-process" }
chinwag-swarm = { path = "../chinwag-swarm", version = "=0.0.1" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
rustix = { version = "1", features = ["fs", "process"] }
rand.workspace = true
chinwag-signing = { path = "../chinwag-signing" }
chinwag-claim = { path = "../chinwag-claim" }
chinwag-confirmed-initial-private = { path = "../confirmed-initial" }
chinwag-mcp-private-anchored = { path = "../chinwag-mcp", features = ["private-loopback"] }
chinwag-editor-config-private = { path = "../chinwag-editor-config" }
chinwag-snapshot-session-private = { path = "../chinwag-snapshot-session" }
chinwag-snapshot-read-owner-private = { path = "../chinwag-snapshot-read-owner" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
chinwag-history-archive = { path = "../chinwag-history-archive" }
blake3 = "=1.8.7"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.9.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
chinwag-test-fixtures = { path = "../chinwag-test-fixtures" }
