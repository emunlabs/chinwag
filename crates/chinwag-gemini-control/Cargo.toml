[package]
name = "chinwag-gemini-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = []

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "io-util", "sync", "time", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "1", features = ["fs", "process"] }
getrandom = "=0.3.4"
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
libc = "=0.2.191"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "test-util"] }
