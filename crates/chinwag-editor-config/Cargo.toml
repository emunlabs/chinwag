[package]
name = "chinwag-editor-config-private"
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["raw_value"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process", "try_close"] }
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
chinwag-snapshot-read-owner-private = { path = "../chinwag-snapshot-read-owner" }
chinwag-snapshot-session-private = { path = "../chinwag-snapshot-session" }
chinwag-confirmed-initial-private = { path = "../confirmed-initial" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
chinwag-test-fixtures = { path = "../chinwag-test-fixtures" }
