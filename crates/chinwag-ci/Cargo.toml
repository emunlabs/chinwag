[package]
name = "chinwag-ci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.22.1"
chinwag-swarm = { path = "../chinwag-swarm" }
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
hex = "=0.4.3"
hpke.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
rsa = { version = "=0.9.10", features = ["sha2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "=1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
