[package]
name = "chinwag-ci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
chacha20poly1305.workspace = true
chinwag-swarm = { path = "../chinwag-swarm" }
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
hex = "=0.4.3"
hpke.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
rsa = { version = "=0.9.10", features = ["sha2"] }
rand.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio = { version = "=1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "time", "net", "sync", "signal"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
