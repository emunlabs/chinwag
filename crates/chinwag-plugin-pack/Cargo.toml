[package]
name = "chinwag-plugin-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chinwag-plugin-pack"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.7"
chinwag-editor-config-private = { path = "../chinwag-editor-config" }
chinwag-mcp-private-anchored = { path = "../chinwag-mcp" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
flate2 = "=1.1.10"
getrandom = "=0.3.4"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
toml = { version = "=0.8.2", default-features = false, features = ["parse"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
