[package]
name = "chinwag-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chinwag-claim = { path = "../chinwag-claim" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
swarm-discovery = "=0.6.5"
iroh-mainline-address-lookup = "=0.6.1"
n0-mainline = "=0.7.1"
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
iroh-blobs = { version = "=0.103.1", default-features = false }
bao-tree = "0.16"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
rustix = { version = "1", features = ["process", "fs"] }
rand.workspace = true
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
thiserror.workspace = true
tracing = "0.1"
zeroize.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "getrandom", "ring", "rustls-platform-verifier"] }
http = "1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"

[dev-dependencies]
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["server"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
