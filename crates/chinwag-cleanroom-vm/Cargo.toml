[package]
name = "chinwag-cleanroom-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ephemeral Apple Silicon Tart cleanroom VM driver, read-only VirtioFS + XNU Seatbelt enforcement, zero-Nix flake.lock compiler, 2-tier runner trust split, and HPKE diagnostic bundle sealing."

[dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.7"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = "=0.3.4"
hex = "=0.4.3"
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "mlkem", "chacha", "hkdfsha2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
toml = { version = "=0.8.2", default-features = false, features = ["parse"] }
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
