[package]
name = "chinwag-seed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "=1.8.7"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
chinwag-swarm = { path = "../chinwag-swarm" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
futures-util = "0.3"
chacha20poly1305.workspace = true
hpke.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zstd.workspace = true

rustix = { version = "1", features = ["fs", "process"] }
rig-core = { version = "=0.45.0", default-features = false }
rig-rmcp = { version = "=0.45.0", default-features = false }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std", "time", "process", "sync"] }

[dev-dependencies]
iroh-blobs = { version = "=0.103.1", default-features = false }
chinwag-test-fixtures = { path = "../chinwag-test-fixtures" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
chinwag-host-process = { path = "../chinwag-host-process" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
chinwag-host-process = { path = "../chinwag-host-process", features = ["test-support"] }
