[package]
name = "chinwag-ui"
description = "Chinwag Mission Control in pure Rust Dioxus (CHWG-DIOXUS-1). Zero Node.js."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chinwag_ui"
path = "src/lib.rs"

[[bin]]
name = "chinwag-ui"
path = "src/main.rs"

[features]
# `server` is the default so `cargo build --workspace` stays native-only and light.
default = ["server"]
server = ["dioxus/server", "dep:reqwest", "dep:axum"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "router", "macro", "html", "signals", "hooks", "launch", "document"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
