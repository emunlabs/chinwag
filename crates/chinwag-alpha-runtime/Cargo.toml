[package]
name = "chinwag-alpha-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chinwag-connectors = { path = "../chinwag-connectors" }
chinwag-connector-registry = { path = "../chinwag-connector-registry" }
chinwag-client-discovery = { path = "../chinwag-client-discovery" }
chinwag-bus-client = { path = "../chinwag-bus-client" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "1", features = ["fs", "process"] }
sha2.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
