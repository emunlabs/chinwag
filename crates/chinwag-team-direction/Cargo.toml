[package]
name = "chinwag-team-direction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = []

[dependencies]
chinwag-codex-steer = { path = "../chinwag-codex-steer" }
chinwag-claude-control = { path = "../chinwag-claude-control" }
chinwag-gemini-control = { path = "../chinwag-gemini-control" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "1", features = ["fs", "process"] }
getrandom = "=0.3.4"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
chinwag-claude-control = { path = "../chinwag-claude-control", features = ["test-support"] }
chinwag-gemini-control = { path = "../chinwag-gemini-control", features = ["test-support"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "io-util", "test-util", "net"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
